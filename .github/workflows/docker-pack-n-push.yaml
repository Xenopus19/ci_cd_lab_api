name: docker-pack-n-push

on:
  workflow_call:
    inputs:
      repository:
        description: Docker image repository name
        type: string
        required: true
      tag:
        description: Image tag
        type: string
        required: true
      push:
        description: Push to Docker Hub (true) or save as workflow artifact (false)
        type: boolean
        default: false
      dockerfile:
        type: string
        default: ./Dockerfile
      context:
        type: string
        default: .
      latest:
        description: Also tag the image as latest
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ inputs.repository }}:${{ inputs.tag }}
            ${{ inputs.latest && format('{0}:latest', inputs.repository) || '' }}

      - name: Build Docker image to tarball
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          tags: ${{ inputs.repository }}:${{ inputs.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Upload image artifact
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ inputs.tag }}
          path: ${{ runner.temp }}/image.tar
