apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
      - name: web-server
        image: ghcr.io/your-username/your-repo/web-server:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: db-credentials