apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cats.name" . }}-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cats.name" . }}-migration-reader
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: [{{ include "cats.migrationName" . | quote }}]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cats.name" . }}-migration-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "cats.name" . }}-api
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cats.name" . }}-migration-reader
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cats.name" . }}-api
spec:
  ports:
    - port: 3000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cats.name" . }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "cats.name" . }}-api
      initContainers:
        - name: wait-for-migration
          image: "{{ .Values.images.kubectl.repository }}:{{ .Values.images.kubectl.tag }}"
          imagePullPolicy: {{ .Values.images.kubectl.pullPolicy }}
          command: ["kubectl", "wait", "--for=condition=complete", "--timeout={{ .Values.migration.activeDeadlineSeconds }}s", "job/{{ include "cats.migrationName" . }}"]
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: DATABASE_URL
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
